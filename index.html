<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Website resmi OSIS Putra SMAFISTA (SMA AL-FITYAN SCHOOL TANGERANG).">
  <title>OSIS Putra SMAFISTA</title>
  <link rel="icon" type="image/png" href="assets/assets2025/Lobby Section/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { corePlugins: { preflight: false } };
  </script>
  <script src="https://kit.fontawesome.com/bada788eda.js" crossorigin="anonymous"></script>
</head>
<body class="is-lobby" data-page="index">

  <!-- ══════════════ SKELETON LOADING ══════════════ -->
  <div id="skeletonLoader" class="skeleton-loader" aria-hidden="true">
    <div class="skeleton-inner">
      <div class="flex items-center justify-center gap-4 mb-8">
        <div class="sk-block w-14 h-14 rounded-full"></div>
        <div class="sk-block w-40 h-14 rounded-full"></div>
      </div>
      <div class="flex justify-center mb-8">
        <div class="sk-block w-72 h-8"></div>
      </div>
      <div class="flex flex-wrap justify-center gap-6">
        <div class="sk-block w-72 h-64 rounded-3xl"></div>
        <div class="sk-block w-72 h-64 rounded-3xl"></div>
      </div>
      <div class="flex justify-center mt-8">
        <div class="sk-block w-32 h-5 rounded-full"></div>
      </div>
    </div>
  </div>

  <!-- ══════════════ LOBBY (HALAMAN UTAMA) ══════════════ -->
  <main class="osis-lobby" id="lobby" aria-label="Pilih periode OSIS" >
    <div class="background-layer" aria-hidden="true">
      <img
        src="assets/assets2026/Lobby OSIS/alfityan.jpg"
        alt=""
        onerror="this.onerror=null; this.src='assets/assets2025/Lobby Section/alfityan2-gambargedung.png';"
      >
      <div class="background-overlay"></div>
      <div class="ambient-light ambient-light-left"></div>
      <div class="ambient-light ambient-light-right"></div>
    </div>

    <div class="lobby-brand" aria-label="OSIS Putra SMAFISTA dan Al-Fityan School Tangerang">
      <img
        class="main-logo"
        data-parallax="0.08"
        src="assets/assets2026/Lobby OSIS/logo.png"
        alt="Logo OSIS SMAFISTA"
        onerror="this.onerror=null; this.src='assets/assets2025/Lobby Section/logo.png';"
      >
      <a
        class="school-logo-link"
        href="https://alfityantangerang.sch.id/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Website Al-Fityan School Tangerang"
      >
        <img
          class="school-logo"
          data-parallax="0.08"
          src="assets/assets2025/Lobby Section/al-fityan-logo-cropped.png"
          alt="Logo Al-Fityan School Tangerang"
        >
      </a>
      <div class="lobby-title" style="text-align: center;">
        <span>Official Website</span>
        <strong >OSIS Putra SMAFISTA</strong>
      </div>
    </div>

    <section class="generation-selector" aria-label="Pilihan periode OSIS">
      <button class="generation-stage generation-stage-old" type="button" data-open-generation="2024" aria-label="Buka OSIS 2024/2025">
        <img class="stage-watermark" src="assets/assets2025/Lobby Section/logo.png" alt="" aria-hidden="true">
        <div class="people-layer people-layer-duo" aria-hidden="true">
          <img class="person person-wian" data-parallax="0.22" src="assets/assets2025/Lobby Section/wian.png" alt="">
          <img class="person person-caesar" data-parallax="-0.18" src="assets/assets2025/Lobby Section/Caesar.png" alt="">
        </div>
        <span class="period-bottom">
          <strong>Periode 2024/2025</strong>
        </span>
      </button>

      <button class="generation-stage generation-stage-new" type="button" data-open-generation="2026" aria-label="Buka OSIS 2026/2027">
        <img
          class="stage-watermark"
          src="assets/assets2026/Lobby OSIS/logo.png"
          alt=""
          aria-hidden="true"
          onerror="this.onerror=null; this.src='assets/assets2025/Lobby Section/logo.png';"
        >
        <div class="people-layer people-layer-new" aria-hidden="true">
          <img class="person person-ahnaf-rakyan" data-parallax="0.28" src="assets/assets2026/Lobby OSIS/ahnaf-rakyan-lobby-new.png" alt="">
        </div>
        <span class="period-bottom">
          <strong>Periode 2026/2027</strong>
        </span>
      </button>
    </section>

    <footer class="instagram-link">
      <a href="https://www.instagram.com/osisputrasmafista" target="_blank" rel="noopener noreferrer">@osisputrasmafista</a>
    </footer>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
